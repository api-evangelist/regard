aid: regard
name: Regard
description: >-
  Regard is an AI-powered clinical diagnosis and documentation platform for hospitals and
  health systems. It reviews 100% of a patient's electronic health record (EHR) to surface
  and recommend evidence-supported diagnoses, then generates clinical documentation at the
  point of care. Regard positions itself around "earning revenue through better care, not
  queries," spanning clinical notes, mid-revenue-cycle denial prevention and revenue capture,
  HCC risk-adjustment capture, and screening for care gaps. The company reports 12.9M+
  recommended diagnoses accepted by clinicians and $50M+ in revenue generated for health
  systems. Regard integrates directly with EHRs rather than exposing a public developer API;
  its Health IT Module is ONC 2015 Cures Update certified. Backed by Foundry Group and
  Techstars. This profile is maintained in the API Evangelist network.
