note: >-
  Regard is a CONSUMER of healthcare interoperability standards, not a publisher
  of them. Its Intaker ingestion layer reads patient data out of hospital EHRs
  over those systems' own FHIR APIs; Regard publishes no FHIR server, no
  OpenAPI, and no third-party developer API of its own. The conformance claims
  below are therefore about what Regard can READ and NORMALIZE, and are recorded
  verbatim from Regard's own technology and certification pages. The ONC
  certification criteria Regard holds (B10, D1, D5, D12, D13, G4, G5) do NOT
  include the sec. 170.315(g)(10) standardized-API criterion, so there is no
  certified patient- or population-services API on Regard's side.
